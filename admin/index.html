<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>TenkaAssist - admin</title>
   <meta name="description" content="tenkaAssist">
   <script src="../js/common.js"></script>
   <link rel="stylesheet" href="../css/common.css" type = "text/css">
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
   <script src="../js/characterJson.js"></script>
   <script src="../simulator/calculator.v3.js"></script>
   <script src="../make/autocalc.v3.js"></script>
   <script src="../js/elv.js"></script>
   <script src="./admin.js"></script>
</head>
<body>
   <script src="../js/header.js"></script>
   <div id="admin" class="main-container bg-dark" style="display:none">
      <div class="block">
         <div class="margin-left titleblock"><span id="titleboxText" class="titlebox">admin Page</span> </div>
      </div>
      <div class="block">유저 수 : <span id="userCnt"></span></div>
      <div class="block">
         비밀번호 초기화<br>
         <input id="initPW" class="searchInput" style="width:10rem;" type="text" placeholder="닉네임 입력">
         <button class="button" onclick="initPW()" style="height:2rem; margin-left:1rem;">리셋</button>
      </div>
      <div class="block">
         5구40억,1구20억 미만 : <span id="removeCnt"></span>
         <button class="button" onclick="removeInvalid()" style="height:2rem; margin-left:1rem;">삭제</button>
      </div>
      <div class="block">
         태그 추가<br>
         <input id="addTag" class="searchInput" style="width:10rem;" type="text" placeholder="태그 추가">
         <button class="button" onclick="addTag()" style="height:2rem; margin-left:1rem;">OK</button>
      </div>
      <div class="block">
         태그 삭제<br>
         <input id="delTag" class="searchInput" style="width:10rem;" type="text" placeholder="태그 제거">
         <button class="button" onclick="delTag()" style="height:2rem; margin-left:1rem;">OK</button>
      </div>
      <div class="block">
         <button class="button" onclick="refreshData()" style="height:2rem; margin-left:1rem;">추천덱 갱신</button>
      </div>
      <div class="block">
         ELV 최적 데미지 일괄 갱신<br>
         <button id="elvBulkBtn" class="button" onclick="runElvBulk(false)" style="height:2rem; margin-left:1rem;">전체</button>
         <button id="elvMissingBtn" class="button" onclick="runElvBulk(true)" style="height:2rem; margin-left:0.5rem;">누락분</button>
         <button class="button" onclick="stopElvBulk()" style="height:2rem; margin-left:0.5rem;">중지</button>
         <div id="elvBulkStatus" style="margin-top:0.5rem;"></div>
      </div>
      <div class="block">
         허용되지 않는 조합 삭제<br>
         <button id="invalidCheckBtn" class="button" onclick="checkInvalidComps()" style="height:2rem; margin-left:1rem;">검사</button>
         <button id="invalidDelBtn" class="button" onclick="deleteInvalidComps()" style="height:2rem; margin-left:0.5rem;">삭제</button>
         <div id="invalidStatus" style="margin-top:0.5rem;"></div>
         <div id="invalidList" style="margin-top:0.5rem; max-height:20rem; overflow-y:auto;"></div>
      </div>
   </div>
</body>
</html>
